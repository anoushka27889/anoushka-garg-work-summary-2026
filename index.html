<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Anoushka Garg - Work Summary 2026 GLabs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
#stageArea {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#stage, #hyperlinkPlane {
  max-width: 100vw;
  max-height: 100vh;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
#loadingScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#loadingScreen.loaded {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 3px solid #333;
  border-top: 3px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.loadingText {
  color: #999;
  margin-top: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
}
</style>
</head>
<body id="body" bgcolor="black">
<div id="loadingScreen">
<div class="spinner"></div>
<div class="loadingText">Loading...</div>
</div>
<div id="stageArea">
<div id="stage" class="stage"></div>
<div id="hyperlinkPlane" class="stage"></div>
</div>
<div id="slideshowNavigator"></div>
<div id="slideNumberControl"></div>
<div id="slideNumberDisplay"></div>
<div id="helpPlacard"></div>
<div id="waitingIndicator"><div id="waitingSpinner"></div></div>
<script src="assets/player/main.js"></script>
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loadingScreen').classList.add('loaded');
  }, 100);
});
</script>
</body>
</html>
