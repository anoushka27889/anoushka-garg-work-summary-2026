<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
#stageArea {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#stage, #hyperlinkPlane {
  max-width: 100vw;
  max-height: 100vh;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
#loadingScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#loadingScreen.loaded {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 3px solid #333;
  border-top: 3px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.loadingText {
  color: #999;
  margin-top: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
}

/* Floating Navigation */
#floatingNav {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(76, 255, 161, 0.3);
  border-radius: 12px;
  padding: 12px 20px;
  z-index: 1000;
  display: flex;
  gap: 8px;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.nav-item {
  position: relative;
  color: #4cffa1;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
  user-select: none;
  text-decoration: none;
  display: inline-block;
}

.nav-item.nav-top {
  font-size: 18px;
  padding: 8px 12px;
  font-weight: 600;
}

.nav-item:hover {
  background: rgba(76, 255, 161, 0.1);
  color: #6fffb8;
}

.nav-item.expandable::after {
  content: '▼';
  margin-left: 6px;
  font-size: 9px;
  transition: transform 0.2s ease;
}

.nav-item.expandable.expanded::after {
  transform: rotate(180deg);
}

.submenu {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 8px;
  background: rgba(0, 0, 0, 0.95);
  border: 1px solid rgba(76, 255, 161, 0.3);
  border-radius: 8px;
  padding: 8px 0;
  min-width: 140px;
  display: none;
  flex-direction: column;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
}

.submenu.show {
  display: flex;
}

.submenu-item {
  color: #4cffa1;
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  display: block;
}

.submenu-item:hover {
  background: rgba(76, 255, 161, 0.15);
  color: #6fffb8;
}

.nav-divider {
  width: 1px;
  height: 24px;
  background: rgba(76, 255, 161, 0.2);
  margin: 0 4px;
}

@media (max-width: 768px) {
  #floatingNav {
    bottom: 20px;
    padding: 10px 16px;
    gap: 4px;
    max-width: 90%;
    overflow-x: auto;
    justify-content: flex-start;
  }

  .nav-item {
    padding: 6px 12px;
    font-size: 12px;
  }

  .submenu {
    min-width: 120px;
  }

  .submenu-item {
    font-size: 12px;
    padding: 8px 12px;
  }
}

<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loadingScreen').classList.add('loaded');
  }, 100);
});

// Navigation functionality
document.addEventListener('DOMContentLoaded', function() {
  // Handle expandable menu toggles
  const deepDiveNav = document.getElementById('deepDiveNav');
  const deepDiveMenu = document.getElementById('deepDiveMenu');
  const oldWorkNav = document.getElementById('oldWorkNav');
  const oldWorkMenu = document.getElementById('oldWorkMenu');

  // Toggle Deep Dive menu
  deepDiveNav.addEventListener('click', function(e) {
    e.stopPropagation();
    const isExpanded = deepDiveMenu.classList.contains('show');

    // Close all menus
    deepDiveMenu.classList.remove('show');
    oldWorkMenu.classList.remove('show');
    deepDiveNav.classList.remove('expanded');
    oldWorkNav.classList.remove('expanded');

    // Toggle current menu
    if (!isExpanded) {
      deepDiveMenu.classList.add('show');
      deepDiveNav.classList.add('expanded');
    }
  });

  // Toggle Old Work menu
  oldWorkNav.addEventListener('click', function(e) {
    e.stopPropagation();
    const isExpanded = oldWorkMenu.classList.contains('show');

    // Close all menus
    deepDiveMenu.classList.remove('show');
    oldWorkMenu.classList.remove('show');
    deepDiveNav.classList.remove('expanded');
    oldWorkNav.classList.remove('expanded');

    // Toggle current menu
    if (!isExpanded) {
      oldWorkMenu.classList.add('show');
      oldWorkNav.classList.add('expanded');
    }
  });

  // Close menus when clicking outside
  document.addEventListener('click', function() {
    deepDiveMenu.classList.remove('show');
    oldWorkMenu.classList.remove('show');
    deepDiveNav.classList.remove('expanded');
    oldWorkNav.classList.remove('expanded');
  });

  // Navigation: Jump to slides by simulating rapid keyboard input
  // Keynote HTML exports don't support hash navigation, only keyboard events
  const navLinks = document.querySelectorAll('a[href^="#"]');

  navLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetIndex = parseInt(this.getAttribute('href').substring(1));

      // Find current slide by checking which slide is visible
      const stage = document.getElementById('stage');
      if (!stage || !stage.textContent) {
        navigateToSlide(targetIndex);
        return;
      }

      // Get current slide index from URL hash or default to 0
      const currentHash = window.location.hash;
      const currentIndex = currentHash ? parseInt(currentHash.substring(1)) : 0;

      navigateToSlide(targetIndex, currentIndex);
    });
  });

  function navigateToSlide(targetIndex, currentIndex = 0) {
    const distance = Math.abs(targetIndex - currentIndex);
    const direction = targetIndex > currentIndex ? 'ArrowRight' : 'ArrowLeft';

    // Hide stage during navigation to create instant jump effect
    const stageArea = document.getElementById('stageArea');
    const originalTransition = stageArea.style.transition;
    stageArea.style.transition = 'none';
    stageArea.style.opacity = '0';

    // Rapidly dispatch keyboard events (1ms interval for speed)
    let count = 0;
    const interval = setInterval(function() {
      if (count >= distance) {
        clearInterval(interval);

        // Show stage again after short delay to ensure slide is loaded
        setTimeout(function() {
          stageArea.style.transition = originalTransition;
          stageArea.style.opacity = '1';
        }, 50);

        // Update URL hash to reflect current slide
        history.replaceState(null, null, '#' + targetIndex);
        return;
      }

      const event = new KeyboardEvent('keydown', {
        key: direction,
        code: direction,
        which: direction === 'ArrowRight' ? 39 : 37,
        keyCode: direction === 'ArrowRight' ? 39 : 37,
        bubbles: true,
        cancelable: true
      });

      document.dispatchEvent(event);
      count++;
    }, 1); // 1ms interval for maximum speed
  }

});

</script>
